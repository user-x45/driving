<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Tone.js Library for sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c; /* Dark background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #e2e8f0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Hide scrollbars for true full screen */
            /* Disable text selection to prevent copying */
            -webkit-touch-callout: none; /* iOS Safari */
            -webkit-user-select: none;   /* Safari */
            -khtml-user-select: none;    /* Konqueror HTML */
            -moz-user-select: none;      /* Old versions of Firefox */
            -ms-user-select: none;       /* Internet Explorer/Edge */
            user-select: none;           /* Non-prefixed version, currently supported by Chrome, Edge, Opera and Firefox */
        }

        #gameCanvasContainer {
            position: fixed; /* Fixed position for full screen */
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0; /* Behind UI elements */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Overlay UI elements */
        .ui-overlay {
            position: fixed;
            z-index: 100; /* Above the canvas */
            padding: 20px;
            box-sizing: border-box; /* Changed to border-box for consistent padding */
            width: 100%;
            pointer-events: none; /* Allow clicks to pass through to canvas by default */
        }

        .ui-overlay > * {
            pointer-events: auto; /* Re-enable pointer events for specific UI elements */
        }

        .top-left-ui {
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .bottom-center-ui {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: auto; /* Adjust width based on content */
        }

        .game-info-display {
            display: flex;
            justify-content: flex-start;
            font-size: 1.2em;
            font-weight: bold;
            color: #cbd5e0;
            background-color: rgba(45, 55, 72, 0.7); /* Semi-transparent background */
            padding: 8px 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px); /* Optional: blur effect */
            -webkit-backdrop-filter: blur(5px); /* For Safari */
            gap: 20px; /* Space between the info elements */
        }

        .controls-info {
            margin-top: 15px;
            font-size: 0.9em;
            color: #a0aec0;
            text-align: center;
            background-color: rgba(45, 55, 72, 0.7);
            padding: 8px 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .game-button {
            background: linear-gradient(145deg, #4299e1, #3182ce); /* Blue gradient */
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        .game-button:hover {
            background: linear-gradient(145deg, #3182ce, #2c5282); /* Darker blue on hover */
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.4);
        }
        .game-button:active {
            transform: translateY(0);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
            background: #1a202c; /* Darkest on active */
        }
        .game-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            transition: all 0.75s ease-out;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
        }
        .game-button:hover::before {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* Message Box Styling */
        .message-box, .settings-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #2d3748;
            border: 2px solid #4299e1;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            text-align: center;
            color: #e2e8f0;
            font-size: 1.1em;
            max-width: 90%;
            pointer-events: auto; /* Ensure message box is interactive */
        }
        .message-box button, .settings-screen button {
            margin-top: 20px;
            background-color: #4299e1;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }
        .message-box button:hover, .settings-screen button:hover {
            background-color: #3182ce;
        }
        .hidden {
            display: none;
        }

        /* SEGA Logo Overlay Styling */
        #segaLogoOverlay {
            position: fixed; /* Fixed position for full screen overlay */
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000; /* Changed to black */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001; /* Above everything else */
            transition: opacity 1s ease-out; /* Smooth fade out */
            opacity: 1;
        }
        #segaLogoOverlay.fade-out {
            opacity: 0;
            pointer-events: none; /* Disable interaction after fade out */
        }
        /* New SEGA Logo Styling with HTML/CSS */
        #segaLogo {
            font-family: 'Inter', sans-serif; /* Use Inter font for consistency */
            font-size: 3em; /* Adjust size for "Created by Gemini" */
            font-weight: bold;
            color: white;
            background-color: transparent; /* No background color */
            padding: 10px 20px;
            border-radius: 10px;
            letter-spacing: 2px; /* Slightly less letter spacing */
            box-shadow: none; /* No box shadow */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); /* Keep text shadow for depth */
            transform: scale(0.5); /* Start smaller for animation */
            display: inline-block;
            animation: growText 1.5s ease-out forwards; /* Apply grow animation */
        }

        /* Keyframe animation for growing text */
        @keyframes growText {
            from {
                font-size: 1em; /* Start from a smaller size */
                transform: scale(0.5); /* Start smaller */
                opacity: 0;
            }
            to {
                font-size: 3em; /* Grow to original size */
                transform: scale(1); /* Grow to original scale */
                opacity: 1;
            }
        }

        #gemini-gradient-text {
            /* Apply gradient background */
            background: linear-gradient(to right, #007bff, #8a2be2, #ff0000); /* Blue, Purple, Red */
            /* Clip background to text */
            -webkit-background-clip: text;
            background-clip: text;
            /* Make text transparent to show background */
            -webkit-text-fill-color: transparent;
            color: transparent; /* Fallback for non-webkit browsers */
            display: inline; /* Ensure it behaves like text */
        }

        /* Media query to adjust text size for mobile/tablet */
        @media (max-width: 767px) {
            .game-info-display {
                font-size: 1em; /* Smaller font size for game info */
                padding: 6px 10px; /* Slightly smaller padding */
                gap: 10px; /* Smaller gap */
            }
            .controls-info {
                font-size: 0.8em; /* Smaller font size for controls info */
                padding: 6px 10px; /* Slightly smaller padding */
            }
            #segaLogo { /* Adjust font size for "Created by Gemini" on small screens */
                font-size: 2em; /* Smaller size for mobile/tablet */
            }
            @keyframes growText { /* Adjust animation for smaller size on small screens */
                from {
                    font-size: 0.8em; /* Start from a smaller size */
                    transform: scale(0.5); /* Start smaller */
                    opacity: 0;
                }
                to {
                    font-size: 2em; /* Grow to mobile size */
                    transform: scale(1); /* Grow to original scale */
                    opacity: 1;
                }
            }
            /* Adjust game title size for mobile/tablet */
            #titleScreen .game-title { /* Increased specificity here */
                font-size: 2em; /* Smaller font size for mobile/tablet */
                margin-bottom: 30px; /* Adjust margin as well */
                text-shadow: 0 0 8px rgba(0, 255, 255, 0.5), 0 0 15px rgba(0, 255, 255, 0.3); /* Adjust shadow */
            }
            /* Subtitle size for mobile/tablet */
            #titleScreen .game-subtitle {
                font-size: 1.2em; /* Smaller subtitle size for mobile/tablet */
                margin-bottom: 20px; /* Adjust margin for mobile */
            }
        }

        /* Title Screen Styling */
        #titleScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a202c; /* Same as body background */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999; /* Below logo overlay, above canvas */
            color: #e2e8f0;
            /* Removed background image properties */
        }

        .game-title {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 10px; /* Reduced margin to make space for subtitle */
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5), 0 0 20px rgba(0, 255, 255, 0.3);
            color: #4299e1; /* Blue color for the title */
            /* Removed background to text properties */
        }

        .game-subtitle {
            font-size: 1.5em; /* Subtitle size */
            font-weight: normal;
            margin-bottom: 40px; /* Margin below subtitle */
            color: #cbd5e0; /* Lighter color for subtitle */
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
        }

        /* Adjustments for elements that are hidden/shown */
        #gameCanvasContainer.hidden,
        .ui-overlay.hidden,
        #titleScreen.hidden {
            display: none;
        }
        /* New button group for title screen to arrange buttons horizontally */
        #titleScreen .button-group {
            flex-direction: row; /* Arrange buttons in a row */
            margin-top: 40px; /* Add some space below subtitle */
        }

        /* Settings Screen specific styles */
        .settings-screen {
            padding: 30px;
            min-width: 300px;
        }
        .settings-screen h2 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #4299e1;
        }
        .settings-option {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .settings-option label {
            font-size: 1em;
            margin-bottom: 8px;
            color: #cbd5e0;
        }
        /* Enhanced Listbox (Select) Design */
        .settings-option select {
            background-color: #4a5568; /* Darker grey background */
            color: #e2e8f0; /* Light text color */
            border: 2px solid #4299e1; /* Blue border */
            border-radius: 8px; /* More rounded corners */
            padding: 10px 15px; /* Increased padding */
            font-size: 1em;
            cursor: pointer;
            width: 100%;
            max-width: 200px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); /* Subtle shadow */
            transition: all 0.2s ease-in-out; /* Smooth transition for hover/focus */
            -webkit-appearance: none; /* Remove default arrow for custom styling */
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23e2e8f0" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>'); /* Custom SVG arrow */
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 18px;
        }
        .settings-option select:hover {
            border-color: #3182ce; /* Darker blue on hover */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); /* More pronounced shadow on hover */
        }
        .settings-option select:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.7); /* Prominent focus ring */
        }
        .settings-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        /* Adjustments for elements that are hidden/shown */
        #gameCanvasContainer.hidden,
        .ui-overlay.hidden,
        #titleScreen.hidden {
            display: none;
        }
    </style>
</head>

        let currentLanguage = 'ja'; // Default to Japanese

        function applyTranslations(lang) {
            currentLanguage = lang;

            startButton.textContent = t.startButton;
            restartButton.textContent = t.restartButton;

        // Message box functions
        function showMessage(message) {
            messageText.textContent = message;
            messageBox.classList.remove('hidden');
        }

        function hideMessageBox() {
            messageBox.classList.add('hidden');

        // Settings screen functions
        function showSettingsScreen() {
            settingsScreen.classList.remove('hidden');
            titleScreen.classList.add('hidden'); // Hide title screen when settings are open
            // Pause game if it's running
            if (gameStarted && !gameOver) {
                cancelAnimationFrame(animationFrameId);
                clearInterval(gameTimerInterval);
            }
        }

        function hideSettingsScreen() {
            settingsScreen.classList.add('hidden');
            // Show title screen again if game has not started
            if (!gameStarted) {
                titleScreen.classList.remove('hidden');
            }
            // Resume game if it was running and not over
            if (gameStarted && !gameOver) {
                animationFrameId = requestAnimationFrame(animate);
                gameTimerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft <= 0) {
                        clearInterval(gameTimerInterval);
                        endGame();
                    }
                    updateUI();
                }, 1000);
            }
        }

        // Function to update player car color and mesh
        function updatePlayerCarColor(newColorHex) {
            // Remove old mesh from scene
            if (playerCarMesh) {
                scene.remove(playerCarMesh);
            }

            // Update playerCar color (convert hex string to number)
            playerCar.color = parseInt(newColorHex, 16);

            // Create new mesh with updated color
            playerCarMesh = createCarMesh(playerCar.color);
            // Maintain player car's current position and rotation
            playerCarMesh.position.set(playerCar.currentTurnOffset, playerCar.y, playerCar.z);
            scene.add(playerCarMesh);

            // Save to local storage
            try {
                localStorage.setItem('playerCarColor', playerCar.color.toString());
            } catch (e) {
                console.error("Error saving car color to localStorage:", e);
            }
        }

        // Event Listeners for keyboard controls
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Touch controls for mobile
        let touchStartX = 0;
        let touchStartY = 0;

        gameCanvasContainer.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent default touch behavior like scrolling
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        gameCanvasContainer.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevent default touch behavior
            const touchCurrentX = e.touches[0].clientX;
            const touchCurrentY = e.touches[0].clientY;

            const deltaX = touchCurrentX - touchStartX;
            const deltaY = touchCurrentY - touchStartY;

            // Simulate left/right arrow keys for steering
            if (deltaX > 20) { // Swipe right
                keys['ArrowRight'] = true;
                keys['ArrowLeft'] = false;
            } else if (deltaX < -20) { // Swipe left
                keys['ArrowLeft'] = true;
                keys['ArrowRight'] = false;
            } else {
                keys['ArrowLeft'] = false;
                keys['ArrowRight'] = false;
            }

            // Simulate up/down arrow keys for acceleration/braking
            if (deltaY < -20) { // Swipe up (forward)
                keys['ArrowUp'] = true;
                keys['ArrowDown'] = false;
            } else if (deltaY > 20) { // Swipe down (backward/brake)
                keys['ArrowDown'] = true;
                keys['ArrowUp'] = false;
            } else {
                keys['ArrowUp'] = false;
                keys['ArrowDown'] = false;
            }
        });

        gameCanvasContainer.addEventListener('touchend', (e) => {
            e.preventDefault(); // Prevent default touch behavior
            // Release all keys on touch end
            keys = {};
        });

        // Function to create a car-like mesh (a group of boxes)
        function createCarMesh(color) {
            const carGroup = new THREE.Group();
            const mainBodyMaterial = new THREE.MeshLambertMaterial({ color: color });
            const windowMaterial = new THREE.MeshLambertMaterial({ color: 0x2c3e50 }); // Dark grey for windows

            // Main body
            const mainBodyGeometry = new THREE.BoxGeometry(playerCar.width, playerCar.height * 0.7, playerCar.depth);
            const mainBody = new THREE.Mesh(mainBodyGeometry, mainBodyMaterial);
            mainBody.position.y = playerCar.height * 0.7 / 2; // Base on the ground
            carGroup.add(mainBody);

            // Cabin (top part)
            const cabinWidth = playerCar.width * 0.8;
            const cabinHeight = playerCar.height * 0.5;
            const cabinDepth = playerCar.depth * 0.6;
            const cabinGeometry = new THREE.BoxGeometry(cabinWidth, cabinHeight, cabinDepth);
            const cabin = new THREE.Mesh(cabinGeometry, mainBodyMaterial);
            cabin.position.y = mainBody.position.y + (playerCar.height * 0.7 / 2) + (cabinHeight / 2); // On top of main body
            cabin.position.z = playerCar.depth * 0.1; // Slightly towards the front
            carGroup.add(cabin);

            // Windshield (front window)
            const windshieldGeometry = new THREE.PlaneGeometry(cabinWidth * 0.9, cabinHeight * 0.7);
            const windshield = new THREE.Mesh(windshieldGeometry, windowMaterial);
            windshield.position.set(cabin.position.x, cabin.position.y + cabinHeight * 0.1, cabin.position.z + cabinDepth / 2 + 0.01);
            carGroup.add(windshield);

            // Rear window
            const rearWindowGeometry = new THREE.PlaneGeometry(cabinWidth * 0.9, cabinHeight * 0.7);
            const rearWindow = new THREE.Mesh(rearWindowGeometry, windowMaterial);
            rearWindow.position.set(cabin.position.x, cabin.position.y + cabinHeight * 0.1, cabin.position.z - cabinDepth / 2 - 0.01);
            rearWindow.rotation.y = Math.PI; // Face backward
            carGroup.add(rearWindow);

            // Side windows (simple planes)
            const sideWindowGeometry = new THREE.PlaneGeometry(cabinDepth * 0.8, cabinHeight * 0.7);
            const leftWindow = new THREE.Mesh(sideWindowGeometry, windowMaterial);
            leftWindow.position.set(cabin.position.x - cabinWidth / 2 - 0.01, cabin.position.y + cabinHeight * 0.1, cabin.position.z);
            leftWindow.rotation.y = -Math.PI / 2;
            carGroup.add(leftWindow);

            const rightWindow = new THREE.Mesh(sideWindowGeometry, windowMaterial);
            rightWindow.position.set(cabin.position.x + cabinWidth / 2 + 0.01, cabin.position.y + cabinHeight * 0.1, cabin.position.z);
            rightWindow.rotation.y = Math.PI / 2;
            carGroup.add(rightWindow);

            // Headlights (small boxes at the front)
            const headlightMaterial = new THREE.MeshLambertMaterial({ color: 0xffeb3b }); // Yellow
            const headlightGeometry = new THREE.BoxGeometry(0.3, 0.3, 0.1);

            const leftHeadlight = new THREE.Mesh(headlightGeometry, headlightMaterial);
            leftHeadlight.position.set(-playerCar.width / 2 + 0.5, mainBody.position.y + 0.2, playerCar.depth / 2 - 0.1);
            carGroup.add(leftHeadlight);

            const rightHeadlight = new THREE.Mesh(headlightGeometry, headlightMaterial);
            rightHeadlight.position.set(playerCar.width / 2 - 0.5, mainBody.position.y + 0.2, playerCar.depth / 2 - 0.1);
            carGroup.add(rightHeadlight);

            return carGroup;
        }

        // Function to create a building mesh (simple boxes)
        function createBuildingMesh() {
            const width = building.minWidth + Math.random() * (building.maxWidth - building.minWidth);
            const height = building.minHeight + Math.random() * (building.maxHeight - building.minHeight);
            const depth = building.minDepth + Math.random() * (building.maxDepth - building.minDepth);
            const color = building.colors[Math.floor(Math.random() * building.colors.length)];

            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshLambertMaterial({ color: color });
            const mesh = new THREE.Mesh(geometry, material);

            // Position buildings on the ground
            mesh.position.y = height / 2;
            return mesh;
        }


        // Three.js Setup
        function initThreeJS() {
            scene = new THREE.Scene();
            // Set camera aspect ratio based on window size for full screen
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            // Set renderer size to full window size
            renderer.setSize(window.innerWidth, window.innerHeight);
            gameCanvasContainer.appendChild(renderer.domElement);

            // Sky
            scene.background = new THREE.Color(0x87CEEB); // Light blue sky

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040); // Soft white light
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(0, 10, 5);
            scene.add(directionalLight);

            // Camera position relative to player car
            camera.position.set(0, 5, 0); // Behind and slightly above player car
            camera.lookAt(0, 0, -50); // Look towards the road ahead

            // Player Car Mesh
            // Initial player car mesh creation using the potentially loaded color
            playerCarMesh = createCarMesh(playerCar.color);
            // Set initial position to the center of the right lane
            playerCarMesh.position.set((playerLaneMinX + playerLaneMaxX) / 2, playerCar.y, playerCar.z);
            playerCar.currentTurnOffset = playerCarMesh.position.x; // Initialize currentTurnOffset with the starting X
            scene.add(playerCarMesh);

            // Create initial road segments
            createRoad();

            // Create initial buildings
            for (let i = 0; i < 20; i++) { // Create a few buildings initially
                spawnBuilding(true); // Spawn far ahead
            }
        }

        function createRoad() {
            const roadMaterial = new THREE.MeshLambertMaterial({ color: road.color });
            const laneMaterial = new THREE.MeshBasicMaterial({ color: road.laneColor });
            const edgeMaterial = new THREE.MeshBasicMaterial({ color: road.edgeColor });

            for (let i = 0; i < road.numSegments; i++) {
                const zPos = -i * road.segmentLength; // Position segments further down the road

                // Main road segment
                const roadGeometry = new THREE.PlaneGeometry(road.width, road.segmentLength);
                const roadMesh = new THREE.Mesh(roadGeometry, roadMaterial);
                roadMesh.rotation.x = -Math.PI / 2; // Rotate to lie flat on XZ plane
                roadMesh.position.set(0, 0, zPos - road.segmentLength / 2); // Center of segment
                scene.add(roadMesh);

                // Lane line (center)
                const laneLineGeometry = new THREE.PlaneGeometry(road.laneWidth, road.segmentLength / 4);
                const laneLineMesh = new THREE.Mesh(laneLineGeometry, laneMaterial);
                laneLineMesh.rotation.x = -Math.PI / 2;
                laneLineMesh.position.set(0, 0.01, zPos - road.segmentLength / 2); // Slightly above road
                scene.add(laneLineMesh);

                // Edge lines (left and right)
                const edgeLineGeometry = new THREE.PlaneGeometry(0.5, road.segmentLength);
                const leftEdgeMesh = new THREE.Mesh(edgeLineGeometry, edgeMaterial);
                leftEdgeMesh.rotation.x = -Math.PI / 2;
                leftEdgeMesh.position.set(-road.width / 2 - 0.25, 0.01, zPos - road.segmentLength / 2);
                scene.add(leftEdgeMesh);

                const rightEdgeMesh = new THREE.Mesh(edgeLineGeometry, edgeMaterial);
                rightEdgeMesh.rotation.x = -Math.PI / 2;
                rightEdgeMesh.position.set(road.width / 2 + 0.25, 0.01, zPos - road.segmentLength / 2);
                scene.add(rightEdgeMesh);

                roadSegments.push({
                    road: roadMesh,
                    lane: laneLineMesh,
                    leftEdge: leftEdgeMesh,
                    rightEdge: rightEdgeMesh,
                    z: zPos // Store original Z for recycling
                });
            }
        }

        function updateRoadSegments() {
            const speedFactor = playerCar.speed * 0.1; // Adjust speed for visual effect

            for (let i = 0; i < roadSegments.length; i++) {
                const segment = roadSegments[i];
                segment.road.position.z += speedFactor;
                segment.lane.position.z += speedFactor;
                segment.leftEdge.position.z += speedFactor;
                segment.rightEdge.position.z += speedFactor;

                // Recycle segments that go behind the camera
                if (segment.road.position.z > camera.position.z + road.segmentLength / 2) {
                    segment.road.position.z -= road.numSegments * road.segmentLength;
                    segment.lane.position.z -= road.numSegments * road.segmentLength;
                    segment.leftEdge.position.z -= road.numSegments * road.segmentLength;
                    segment.rightEdge.position.z -= road.numSegments * road.segmentLength;
                }
            }
        }

        function updatePlayerCar() {
            // Acceleration/Braking
            if (keys['ArrowUp']) {
                playerCar.speed += playerCar.acceleration;
            } else if (keys['ArrowDown']) {
                playerCar.speed -= playerCar.deceleration;
            } else {
                // Apply friction if no acceleration/braking
                playerCar.speed -= playerCar.friction;
            }

            // Clamp speed
            playerCar.speed = Math.max(0, Math.min(playerCar.speed, playerCar.maxSpeed));

            // Adjust engine sound pitch based on speed
            if (engineSynth && Tone.context.state === 'running') {
                const timeForScheduling = Tone.context.currentTime;
                if (typeof timeForScheduling === 'number' && !isNaN(timeForScheduling)) {
                    const minFreq = 50;
                    const maxFreq = 200;
                    const freq = minFreq + (playerCar.speed / playerCar.maxSpeed) * (maxFreq - minFreq);
                    engineSynth.frequency.setValueAtTime(freq, timeForScheduling + 0.001);
                    engineSynth.volume.setValueAtTime(playerCar.speed > 0.1 ? -10 : -Infinity, timeForScheduling + 0.001);
                } else {
                    console.error(translations[currentLanguage].invalidTimeScheduling + "updatePlayerCar:", timeForScheduling);
                }
            }


            // Steering (update currentTurnOffset)
            if (keys['ArrowLeft']) {
                playerCar.currentTurnOffset = Math.max(playerLaneMinX, playerCar.currentTurnOffset - playerCar.turnSpeed);
            } else if (keys['ArrowRight']) {
                playerCar.currentTurnOffset = Math.min(playerLaneMaxX, playerCar.currentTurnOffset + playerCar.turnSpeed);
            } else {
                // Gently move back to the center of the right lane if no steering input
                const targetX = (playerLaneMinX + playerLaneMaxX) / 2;
                if (Math.abs(playerCar.currentTurnOffset - targetX) > 0.05) { // Small threshold to prevent jitter
                    playerCar.currentTurnOffset += Math.sign(targetX - playerCar.currentTurnOffset) * playerCar.turnSpeed / 2;
                } else {
                    playerCar.currentTurnOffset = targetX; // Snap to center if close enough
                }
            }
            playerCarMesh.position.x = playerCar.currentTurnOffset;

            // Road boundary collision check (for going completely off the road, not just into opposing lane)
            const absoluteRoadMinX = -road.width / 2 + playerCar.width / 2;
            const absoluteRoadMaxX = road.width / 2 - playerCar.width / 2;
            if (playerCarMesh.position.x < absoluteRoadMinX || playerCarMesh.position.x > absoluteRoadMaxX) {
                playerCar.speed *= 0.8; // Lose speed on collision
                endGame(); // Game over if off road
            }

            // Update distance based on speed
            distance += playerCar.speed * 0.1; // Convert speed to distance
        }

        // Opponent car functions
        function spawnOpponentCar() {
            // Randomly choose a position within the opponent lane (left side)
            const randomLaneX = opponentLaneMinX + Math.random() * (opponentLaneMaxX - opponentLaneMinX);
            const randomColor = opponentCarColors[Math.floor(Math.random() * opponentCarColors.length)];
            const opponentSpeed = playerCar.speed * (0.8 + Math.random() * 0.4); // Relative speed to player

            const opponentMesh = createCarMesh(randomColor);

            // Spawn far ahead
            opponentMesh.position.set(randomLaneX, playerCar.y, -road.segmentLength * (road.numSegments - 2) - Math.random() * 50);
            scene.add(opponentMesh);

            opponentCars.push({
                mesh: opponentMesh,
                speed: opponentSpeed
            });
        }

        function updateOpponentCars() {
            // Spawn new cars
            if (performance.now() - lastOpponentSpawnTime > opponentSpawnInterval && playerCar.speed > 5) {
                spawnOpponentCar();
                lastOpponentSpawnTime = performance.now();
            }

            // Move and remove cars
            for (let i = 0; i < opponentCars.length; i++) {
                const car = opponentCars[i];
                // Opponent car moves relative to player's speed
                car.mesh.position.z += (playerCar.speed - car.speed) * 0.5;

                // Remove if off-screen (behind camera)
                if (car.mesh.position.z > camera.position.z + playerCar.depth / 2) {
                    scene.remove(car.mesh);
                    opponentCars.splice(i, 1);
                    i--;
                }
            }
        }

        // Building functions
        function spawnBuilding(initialSpawn = false) {
            const newBuilding = createBuildingMesh();
            // Randomly place building on left or right side of the road
            const side = Math.random() < 0.5 ? -1 : 1;
            // Now that createBuildingMesh returns a THREE.Mesh directly, we can access its geometry parameters directly
            newBuilding.position.x = side * (road.width / 2 + newBuilding.geometry.parameters.width / 2 + Math.random() * 10);
            newBuilding.position.z = initialSpawn ? -Math.random() * building.spawnDistance : camera.position.z - building.spawnDistance;
            scene.add(newBuilding);
            buildings.push(newBuilding);
        }

        function updateBuildings() {
            const speedFactor = playerCar.speed * 0.1; // Buildings move with road speed

            // Spawn new buildings
            if (performance.now() - building.lastSpawnTime > building.spawnInterval && playerCar.speed > 0) {
                spawnBuilding();
                building.lastSpawnTime = performance.now();
            }

            // Move and recycle buildings
            for (let i = 0; i < buildings.length; i++) {
                const b = buildings[i];
                b.position.z += speedFactor;

                // Recycle building if it moves behind the camera
                // Now that b is a THREE.Mesh directly, access geometry parameters directly
                if (b.position.z > camera.position.z + b.geometry.parameters.depth / 2) {
                    scene.remove(b);
                    buildings.splice(i, 1);
                    i--;
                }
            }
        }


        function checkCollisions() {
            // Get the bounding box of the player car mesh
            const playerBox = new THREE.Box3().setFromObject(playerCarMesh);

            for (const car of opponentCars) {
                // Get the bounding box of the opponent car mesh
                const opponentBox = new THREE.Box3().setFromObject(car.mesh);

                if (playerBox.intersectsBox(opponentBox)) {
                    // Collision detected, game over (no sound)
                    endGame();
                    return;
                }
            }
        }

        function updateUI() {
            const t = translations[currentLanguage];
            speedDisplay.textContent = `${t.speedDisplay}${Math.floor(playerCar.speed * 10)} km/h`;
            distanceDisplay.textContent = `${t.distanceDisplay}${Math.floor(distance)} m`;
            highScoreDisplay.textContent = `${t.highScoreDisplay}${Math.floor(highScore)} m`;

            // Format time for display (MM:SS)
            const minutes = Math.floor(timeLeft / 60);
            const seconds = Math.floor(timeLeft % 60);
            timeDisplay.textContent = `${t.timeDisplay}${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // The main animation loop
        function animate() {
            // Only update game logic if game has started
            if (gameStarted) {
                updatePlayerCar();
                updateRoadSegments();
                updateOpponentCars();
                updateBuildings(); // Update buildings
                checkCollisions();
                updateUI(); // Update UI every frame
            }

            renderer.render(scene, camera);
            animationFrameId = requestAnimationFrame(animate);
        }

        // Tone.js audio setup
        function setupAudio() {
            // Engine sound: Oscillator with a filter for a more "engine-like" feel
            engineSynth = new Tone.Oscillator({
                frequency: 50, // Start low
                type: "sawtooth", // Sawtooth wave for a richer sound
                volume: -Infinity // Start muted
            }).chain(new Tone.Filter(200, "lowpass"), Tone.Destination); // Lowpass filter to muffle high frequencies
            engineSynth.start();
        }

        async function startGame() { // Made async to await Tone.start()
            // Ensure any previous animation frame is cancelled before starting a new one
            cancelAnimationFrame(animationFrameId);

            // Start Tone.js AudioContext on first user interaction (button click)
            if (!isAudioContextStarted) {
                await Tone.start(); // Await Tone.start() to ensure context is running
                isAudioContextStarted = true;
                console.log(translations[currentLanguage].audioContextStarted);
                setupAudio(); // Setup audio only after context is active
            }

            // Start engine sound
            if (engineSynth && Tone.context.state === 'running') {
                const timeForEngineStart = Tone.context.currentTime;
                if (typeof timeForEngineStart === 'number' && !isNaN(timeForEngineStart)) {
                    engineSynth.volume.setValueAtTime(-10, timeForEngineStart + 0.001);
                } else {
                    console.error(translations[currentLanguage].invalidTimeScheduling + "startGame (engineSynth):", timeForEngineStart);
                }
            }

            // Hide title screen and show game UI
            titleScreen.classList.add('hidden');
            gameCanvasContainer.classList.remove('hidden'); // Show the canvas
            document.querySelector('.top-left-ui').classList.remove('hidden'); // Show game info
            document.querySelector('.bottom-center-ui').classList.remove('hidden'); // Show controls info and restart button

            gameStarted = true;
            gameOver = false;
            distance = 0;
            playerCar.speed = 0;
            playerCar.currentTurnOffset = (playerLaneMinX + playerLaneMaxX) / 2; // Reset player car position to center of right lane
            // Re-create player car mesh with current color
            updatePlayerCarColor('0x' + playerCar.color.toString(16)); // Ensure car is redrawn with current color
            playerCarMesh.position.x = playerCar.currentTurnOffset; // Apply reset position

            // Reset time
            timeLeft = gameDuration;
            updateUI(); // Update UI immediately with new time

            // Start game timer
            clearInterval(gameTimerInterval); // Clear any existing timer
            gameTimerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(gameTimerInterval);
                    endGame(); // End game when time runs out
                }
                updateUI(); // Update time display every second
            }, 1000);


            // Clear existing opponent cars from scene and array
            opponentCars.forEach(car => scene.remove(car.mesh));
            opponentCars = [];
            lastOpponentSpawnTime = performance.now(); // Reset spawn timer

            // Clear existing buildings from scene and array
            buildings.forEach(b => scene.remove(b));
            buildings = [];
            building.lastSpawnTime = performance.now(); // Reset building spawn timer
            for (let i = 0; i < 20; i++) { // Re-create initial buildings
                spawnBuilding(true);
            }

            restartButton.classList.add('hidden'); // This should remain to hide restart button at start of game

            // Restart the animation loop
            animationFrameId = requestAnimationFrame(animate);
        }

        function endGame() {
            if (gameOver) return; // Prevent multiple calls
            gameOver = true;
            cancelAnimationFrame(animationFrameId); // Stop the animation loop
            clearInterval(gameTimerInterval); // Stop the timer

            // Stop engine sound
            if (engineSynth && Tone.context.state === 'running') {
                const timeForEngineStop = Tone.context.currentTime;
                if (typeof timeForEngineStop === 'number' && !isNaN(timeForEngineStop)) {
                    engineSynth.volume.setValueAtTime(-Infinity, timeForEngineStop + 0.001);
                } else {
                    console.error(translations[currentLanguage].invalidTimeScheduling + "endGame (engineSynth):", timeForEngineStop);
                }
            }

            // Check if game ended due to time limit or collision
            let finalMessage = `${translations[currentLanguage].gameOverMessage}${Math.floor(distance)} m`;
            if (timeLeft <= 0) {
                finalMessage = `${translations[currentLanguage].timeUpMessage}${Math.floor(distance)} m`;
            }

            showMessage(finalMessage);
            restartButton.classList.remove('hidden'); // Show restart button

            if (distance > highScore) {
                highScore = distance;
                saveHighScore(Math.floor(distance));
            }
        }

        // High Score Functions (using Local Storage)
        function saveHighScore(score) {
            try {
                localStorage.setItem('highScore', score.toString());
                console.log(translations[currentLanguage].highScoreSaved, score);
                loadHighScores(); // Reload scores to show new one
            } catch (e) {
                console.error(translations[currentLanguage].errorMessageSave, e);
                showMessage(translations[currentLanguage].errorMessageSave);
            }
        }

        function loadHighScores() {
            try {
                const storedHighScore = localStorage.getItem('highScore');
                highScore = storedHighScore ? parseInt(storedHighScore, 10) : 0;
                highScoreDisplay.textContent = `${translations[currentLanguage].highScoreDisplay}${Math.floor(highScore)} m`;
                console.log(translations[currentLanguage].highScoreLoaded, highScore);
            } catch (e) {
                console.error(translations[currentLanguage].errorMessageLoad, e);
                showMessage(translations[currentLanguage].errorMessageLoad);
            }
        }

        // Handle window resize for responsiveness
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });

        // Initialize game and Local Storage on window load
        window.onload = async function () {
            // Priority: 1. Local Storage, 2. Browser Language, 3. Default (Japanese)
            let langToApply = 'ja'; // Default language

            try {
                const savedLang = localStorage.getItem('gameLanguage');
                if (savedLang && translations[savedLang]) {
                    langToApply = savedLang;
                } else {
                    const userLang = navigator.language || navigator.userLanguage;
                    if (userLang.startsWith('en')) {
                        langToApply = 'en';
                    } else if (userLang.startsWith('zh')) {
                        langToApply = 'zh-CN';
                    } else if (userLang.startsWith('ko')) {
                        langToApply = 'ko';
                    }
                }
            } catch (e) {
                console.error("Error accessing localStorage for language:", e);
            }

            // Load saved car color before initializing Three.js
            try {
                const savedCarColor = localStorage.getItem('playerCarColor');
                if (savedCarColor) {
                    playerCar.color = parseInt(savedCarColor, 10);
                }
            } catch (e) {
                console.error("Error loading car color from localStorage:", e);
            }

            applyTranslations(langToApply);

            initThreeJS(); // Initialize Three.js
            loadHighScores(); // Load high scores from local storage
            animate(); // Start the 3D animation loop immediately, even before game starts

            // Show "Created by Gemini" logo for a few seconds
            segaLogoOverlay.classList.remove('hidden'); // Show logo overlay

            setTimeout(() => {
                segaLogoOverlay.classList.add('fade-out');
                setTimeout(() => {
                    segaLogoOverlay.style.display = 'none';
                    // After logo fades out, show the title screen
                    titleScreen.classList.remove('hidden');
                    updateUI(); // Update UI with initial values (speed 0, distance 0, etc.)
                }, 1000); // Wait for fade-out transition to complete
            }, 1000); // Display logo for 1 second
        };

        // Event Listeners for UI buttons
        startButton.addEventListener('click', startGame);
        messageBoxOkButton.addEventListener('click', hideMessageBox);
        restartButton.addEventListener('click', startGame);
        settingsButton.addEventListener('click', showSettingsScreen); // Show settings
        closeSettingsButton.addEventListener('click', hideSettingsScreen); // Close settings

        languageSelect.addEventListener('change', (e) => {
            const newLang = e.target.value;
            applyTranslations(newLang);
            try {
                localStorage.setItem('gameLanguage', newLang); // Save selected language
            } catch (e) {
                console.error("Error saving language to localStorage:", e);
            }
        });

        carColorSelect.addEventListener('change', (e) => {
            updatePlayerCarColor(e.target.value); // Update car color when selected
        });
    </script>
</body>
</html>
